name: Test and Deploy

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ develop ]

jobs:
  test-and-deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tests in beautiful_framework
        id: trigger
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.WORKFLOW_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/antonlahunou/beautiful_framework/actions/workflows/run-tests.yml/dispatches \
            -d '{"ref":"main", "inputs":{"environment":"staging"}}'
          
          sleep 2
          
          RUN_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.WORKFLOW_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/antonlahunou/beautiful_framework/actions/runs?branch=main&per_page=1 \
            | jq -r '.workflow_runs[0].id')
          
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Wait for tests to complete
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          echo "Waiting for run ID: $RUN_ID"
          
          while true; do
            STATUS=$(curl -s \
              -H "Authorization: token ${{ secrets.WORKFLOW_DISPATCH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/antonlahunou/beautiful_framework/actions/runs/$RUN_ID \
              | jq -r '.status')
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 10
          done

      - name: Check test results
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          CONCLUSION=$(curl -s \
            -H "Authorization: token ${{ secrets.WORKFLOW_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/antonlahunou/beautiful_framework/actions/runs/$RUN_ID \
            | jq -r '.conclusion')
          
          echo "Tests conclusion: $CONCLUSION"
          
          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ Tests failed! Deployment aborted."
            exit 1
          fi
          
          echo "✅ Tests passed! Deploying to staging..."

      - name: Deploy to Railway staging
        run: |
          curl -X POST https://api.railway.app/v1/deploy \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"projectId": "${{ secrets.RAILWAY_PROJECT_ID }}", "environment": "staging"}'

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Railway production
        run: |
          curl -X POST https://api.railway.app/v1/deploy \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"projectId": "${{ secrets.RAILWAY_PROJECT_ID }}", "environment": "production"}'