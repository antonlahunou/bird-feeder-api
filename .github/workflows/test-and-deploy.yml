name: Test and Deploy

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests against staging
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.QA_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/antonlahunou/beautiful_framework/actions/workflows/run-tests.yml/dispatches \
            -d '{"ref":"main", "inputs":{"environment":"staging"}}' \
            -w "\n%{http_code}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ne 204 ]; then
            echo "Error: GitHub API returned $HTTP_CODE"
            exit 1
          fi

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && success()
    steps:
      - name: Deploy to Railway staging
        run: |
          curl -X POST https://api.railway.app/v1/deploy \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"projectId": "${{ secrets.RAILWAY_PROJECT_ID }}", "environment": "staging"}'

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && success()
    steps:
      - name: Deploy to Railway production
        run: |
          curl -X POST https://api.railway.app/v1/deploy \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"projectId": "${{ secrets.RAILWAY_PROJECT_ID }}", "environment": "production"}'